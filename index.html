<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>异常电梯控制台 | MINIGAME</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="console-shell" data-skin="elevator" data-tone="normal">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="gameSubtitle">MINIGAME · ANOMALY SYSTEM SIM</p>
          <h1 id="gameTitle" class="game-title">异常电梯控制台</h1>
        </div>
        <div class="shift-card">
          <span id="remainingLabel">值守倒计时</span>
          <strong id="remaining">60</strong>
        </div>
      </header>

      <section class="grid">
        <section class="panel status-panel">
          <div class="panel-title" id="statusPanelTitle">电梯状态</div>
          <dl class="status-list">
            <div><dt id="floorLabel">楼层</dt><dd id="floor">1</dd></div>
            <div><dt id="doorLabel">门状态</dt><dd id="door">关闭</dd></div>
            <div><dt id="directionLabel">方向</dt><dd id="direction">待机</dd></div>
            <div><dt id="passengersLabel">乘客</dt><dd id="passengers">1</dd></div>
            <div><dt id="powerLabel">电源</dt><dd><meter id="power" min="0" max="100" value="100"></meter><span id="powerText">100</span></dd></div>
            <div><dt id="stabilityLabel">稳定度</dt><dd><meter id="stability" min="0" max="100" value="100"></meter><span id="stabilityText">100</span></dd></div>
            <div><dt id="anomalyLevelLabel">异常等级</dt><dd id="anomalyLevel">0</dd></div>
            <div><dt id="reviveCountLabel">广告复活</dt><dd id="reviveCount">0</dd></div>
            <div><dt id="adHintsCountLabel">加密解码</dt><dd id="adHintsCount">0</dd></div>
            <div><dt id="hiddenLogsCountLabel">待解码</dt><dd id="hiddenLogsCount">0</dd></div>
          </dl>
        </section>

        <section class="panel monitor-panel">
          <div class="panel-title" id="monitorPanelTitle">监控画面</div>
          <div class="monitor" id="monitor">
            监控画面稳定：1 层轿厢内有 1 名乘客。
          </div>
          <div class="scanline"></div>
        </section>

        <section class="panel action-panel">
          <div class="panel-title" id="actionPanelTitle">操作面板</div>
          <div id="actions" class="actions"></div>
          <button id="forceAnomaly" class="secondary" type="button">触发异常测试</button>
        </section>

        <section class="panel log-panel">
          <div class="panel-title" id="logPanelTitle">系统日志</div>
          <ol id="logs" class="logs"></ol>
        </section>
      </section>

      <section id="failureOverlay" class="failure-overlay" hidden>
        <div class="failure-card">
          <p class="eyebrow">SYSTEM FAILURE</p>
          <h2 id="failureTitle">系统崩溃</h2>
          <p id="failureReason">异常等级失控。可观看广告复活。</p>
          <p id="adHint" class="hint"></p>
          <div class="failure-actions">
            <button id="reviveButton" type="button">观看广告复活</button>
            <button id="restartButton" class="secondary" type="button">重新开始</button>
          </div>
        </div>
      </section>

      <!-- 假结局 -->
      <section id="fakeEndingOverlay" class="failure-overlay fake-ending" hidden>
        <div class="failure-card ending-card">
          <p class="eyebrow">⚠ SYSTEM ANOMALY DETECTED</p>
          <h2>操作员关联异常</h2>
          <pre id="fakeEndingText" class="ending-text"></pre>
          <pre id="fakeEndingTruth" class="ending-truth"></pre>
          <div class="failure-actions">
            <button id="fakeEndingTruthBtn" type="button">观看广告揭示真相</button>
            <button id="fakeEndingRestartBtn" class="secondary" type="button">重新开始</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="src/game.js"></script>
  </body>
</html>
