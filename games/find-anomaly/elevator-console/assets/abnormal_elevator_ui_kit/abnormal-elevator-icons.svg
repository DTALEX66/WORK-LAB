<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <style>
      .bg{fill:#090d0d}.panel{fill:#111817;stroke:#345346;stroke-width:2}.txt{fill:#c2ccc5;font-family:Consolas,monospace;font-size:18px}.muted{fill:#6f8078;font-family:Consolas,monospace;font-size:13px}
      .line{fill:none;stroke:#7ed6b0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#ca5b54}.dim{opacity:.55}
    </style>
  </defs>
  <rect class="bg" width="960" height="420"/>
  <text x="36" y="42" class="txt">异常电梯控制台 · 基础图标组件</text>
  <g transform="translate(40 80)">
    <rect class="panel" width="120" height="120" rx="8"/>
    <path class="line" d="M42 35 L24 51 L42 67 M78 35 L96 51 L78 67 M60 32 V88"/>
    <text x="36" y="155" class="txt">关门</text>
    <text x="28" y="178" class="muted">Door Close</text>
  </g>
  <g transform="translate(190 80)">
    <rect class="panel" width="120" height="120" rx="8"/>
    <path class="line" d="M32 74 L60 46 L88 74 M32 92 L60 64 L88 92"/>
    <text x="42" y="155" class="txt">上行</text>
    <text x="36" y="178" class="muted">Move Up</text>
  </g>
  <g transform="translate(340 80)">
    <rect class="panel" width="120" height="120" rx="8"/>
    <circle cx="60" cy="60" r="28" class="line red"/>
    <path class="line red" d="M60 43 V64 M60 78 V79"/>
    <text x="42" y="155" class="txt">急停</text>
    <text x="20" y="178" class="muted">Emergency Stop</text>
  </g>
  <g transform="translate(490 80)">
    <rect class="panel" width="120" height="120" rx="8"/>
    <circle cx="60" cy="60" r="34" class="line"/>
    <path class="line" d="M60 27 V93 M27 60 H93 M60 60 L84 46"/>
    <text x="42" y="155" class="txt">扫描</text>
    <text x="42" y="178" class="muted">Scan</text>
  </g>
  <g transform="translate(640 80)">
    <rect class="panel" width="120" height="120" rx="8"/>
    <path class="line" d="M36 24 H76 L92 40 V96 H36 Z M76 24 V42 H92 M48 58 H78 M48 74 H78"/>
    <text x="24" y="155" class="txt">查看日志</text>
    <text x="44" y="178" class="muted">Logs</text>
  </g>
  <g transform="translate(790 80)">
    <rect class="panel" width="120" height="120" rx="8"/>
    <path class="line" d="M35 42 H85 M35 60 H85 M35 78 H85"/>
    <text x="24" y="155" class="txt">更多操作</text>
    <text x="42" y="178" class="muted">More</text>
  </g>
  <g transform="translate(40 300)">
    <rect class="panel" width="280" height="64" rx="6"/>
    <text x="20" y="27" class="txt">推荐操作</text>
    <path class="line" d="M155 42 H240"/>
    <text x="20" y="49" class="muted">thin glow outline / no neon flood</text>
  </g>
  <g transform="translate(350 300)">
    <rect class="panel" width="280" height="64" rx="6" style="stroke:#6e2725"/>
    <text x="20" y="27" class="txt" style="fill:#ff8d84">危险确认</text>
    <path class="line red" d="M160 42 H240"/>
    <text x="20" y="49" class="muted">long press / slide unlock</text>
  </g>
