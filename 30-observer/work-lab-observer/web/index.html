<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORK-LAB Observatory</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922; --purple: #bc8cff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); }

/* ── Header ── */
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; gap:16px; }
.header h1 { font-size:16px; color:var(--accent); }
.header .status { font-size:11px; color:var(--muted); margin-left:auto; }
.header .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Agent Bar ── */
.agents { display:flex; gap:8px; padding:10px 20px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
.agent-card { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 14px; min-width:120px; text-align:center; }
.agent-card.active { border-color:var(--green); }
.agent-card.inactive { border-color:var(--red); opacity:.6; }
.agent-card .name { font-size:12px; font-weight:600; }
.agent-card .type { font-size:10px; color:var(--muted); }
.agent-card .dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:4px; }
.agent-card.active .dot { background:var(--green); }
.agent-card.inactive .dot { background:var(--red); }

/* ── Main Grid ── */
.main { display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 100px); }
@media(max-width:900px){.main{grid-template-columns:1fr;}}

/* ── Panel ── */
.panel { border-right:1px solid var(--border); padding:16px; overflow-y:auto; }
.panel:last-child { border-right:none; }
.panel h2 { font-size:13px; color:var(--accent); margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:6px; }

/* ── Table ── */
table { width:100%; border-collapse:collapse; font-size:12px; }
th,td { padding:6px 8px; text-align:left; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:600; font-size:11px; }
.badge { display:inline-block; padding:1px 6px; border-radius:10px; font-size:10px; font-weight:600; }
.badge.ok { background:rgba(63,185,80,.15); color:var(--green); }
.badge.fail { background:rgba(248,81,73,.15); color:var(--red); }
.badge.running { background:rgba(88,166,255,.15); color:var(--accent); }
.badge.pending { background:rgba(210,153,34,.15); color:var(--yellow); }

/* ── Token Stats ── */
.token-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.token-card { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:10px; text-align:center; }
.token-card .value { font-size:20px; font-weight:700; color:var(--accent); }
.token-card .label { font-size:10px; color:var(--muted); margin-top:2px; }

/* ── Empty ── */
.empty { text-align:center; padding:24px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>

<div class="header">
  <h1>🔬 WORK-LAB Observatory</h1>
  <span class="status"><span class="live-dot"></span> LIVE · <span id="agent-count">-</span> agents · <span id="last-update">-</span></span>
</div>

<div class="agents" id="agent-bar"></div>

<div class="main">
  <!-- Left: Dagu Task Board -->
  <div class="panel">
    <h2>📋 Dagu DAGs</h2>
    <table>
      <thead><tr><th>Name</th><th>Type</th><th>Steps</th><th>Status</th></tr></thead>
      <tbody id="dagu-dags"></tbody>
    </table>

    <h2 style="margin-top:16px">▶️ Recent Runs</h2>
    <table>
      <thead><tr><th>DAG</th><th>Status</th><th>Steps</th><th>Duration</th></tr></thead>
      <tbody id="dagu-runs"></tbody>
    </table>
  </div>

  <!-- Right: Token Usage + Agent Status -->
  <div class="panel">
    <h2>📊 Token Usage</h2>
    <div class="token-grid" id="token-stats"></div>

    <h2>🤖 Agent Details</h2>
    <table>
      <thead><tr><th>Agent</th><th>Type</th><th>Status</th><th>Sessions</th></tr></thead>
      <tbody id="agent-details"></tbody>
    </table>
  </div>
</div>

<script>
const API = window.location.origin;

async function fetchJSON(path) {
  try { const r = await fetch(API + path, {cache:'no-store'}); return r.ok ? await r.json() : null; }
  catch(e) { return null; }
}

function fmt(n) { return n == null ? '-' : n.toLocaleString(); }
function duration(start, end) {
  if (!start || !end) return '-';
  try {
    const ms = new Date(end) - new Date(start);
    return ms < 1000 ? ms+'ms' : (ms/1000).toFixed(1)+'s';
  } catch(e) { return '-'; }
}

async function refresh() {
  const [snapshot, daguDags, daguRuns, tokens, agents] = await Promise.all([
    fetchJSON('/api/v1/snapshot'),
    fetchJSON('/api/v1/dagu/dags'),
    fetchJSON('/api/v1/dagu/runs'),
    fetchJSON('/api/v1/tokens'),
    fetchJSON('/api/v1/agents'),
  ]);

  // Header
  document.getElementById('agent-count').textContent = agents ? agents.length : '-';
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

  // Agent bar
  const bar = document.getElementById('agent-bar');
  if (agents) {
    bar.innerHTML = agents.map(a => `
      <div class="agent-card ${a.status}">
        <div class="name"><span class="dot"></span>${a.name}</div>
        <div class="type">${a.type}</div>
      </div>
    `).join('');
  }

  // Dagu DAGs
  const dagsTb = document.getElementById('dagu-dags');
  if (daguDags && daguDags.length) {
    dagsTb.innerHTML = daguDags.map(d => `
      <tr><td>${d.name}</td><td>${d.type}</td><td>${d.steps}</td>
      <td><span class="badge ok">defined</span></td></tr>
    `).join('');
  } else {
    dagsTb.innerHTML = '<tr><td colspan="4" class="empty">No DAGs found</td></tr>';
  }

  // Dagu Runs
  const runsTb = document.getElementById('dagu-runs');
  if (daguRuns && daguRuns.length) {
    runsTb.innerHTML = daguRuns.map(r => {
      const cls = r.outcome === 'succeeded' ? 'ok' : r.outcome === 'failed' ? 'fail' : 'pending';
      return `<tr><td>${r.metadata?.dag_name || '?'}</td>
        <td><span class="badge ${cls}">${r.outcome}</span></td>
        <td>${r.toolCalls || 0}</td>
        <td>${duration(r.startedAt, r.finishedAt)}</td></tr>`;
    }).join('');
  } else {
    runsTb.innerHTML = '<tr><td colspan="4" class="empty">No runs yet</td></tr>';
  }

  // Token Stats
  const tg = document.getElementById('token-stats');
  const h = tokens?.hermes || {};
  tg.innerHTML = `
    <div class="token-card"><div class="value">${fmt(h.input_tokens)}</div><div class="label">Input Tokens</div></div>
    <div class="token-card"><div class="value">${fmt(h.output_tokens)}</div><div class="label">Output Tokens</div></div>
    <div class="token-card"><div class="value">${fmt(h.sessions)}</div><div class="label">Sessions</div></div>
  `;

  // Agent Details
  const ad = document.getElementById('agent-details');
  if (agents) {
    ad.innerHTML = agents.map(a => {
      const cls = a.status === 'active' ? 'ok' : 'fail';
      return `<tr><td>${a.name}</td><td>${a.type}</td>
        <td><span class="badge ${cls}">${a.status}</span></td>
        <td>${a.runs ?? '-'}</td></tr>`;
    }).join('');
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
