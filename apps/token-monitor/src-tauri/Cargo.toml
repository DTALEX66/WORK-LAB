[package]
name = "hermes-token-monitor"
version = "0.2.0"
description = "Local-first exact token usage monitor"
authors = ["Workflow-assistance"]
edition = "2021"

[lib]
name = "hermes_token_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.7", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
