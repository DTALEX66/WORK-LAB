[package]
name = "app"
version = "0.1.0"
description = "WORK-LAB Observer — portable cross-project read-only observability shell"
authors = ["DTALEX66"]
# R4/T50: original content is Owner personal-research/non-commercial default
# copyright, NOT a third-party MIT grant. license field removed to avoid
# implying an open grant; third-party deps keep their own licenses.
# license = "MIT"
repository = "https://github.com/DTALEX66/WORK-LAB"
edition = "2021"
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
url = "2"
