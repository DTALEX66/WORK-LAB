# Declarative ownership contract for repo-managed assets and isolated config baseline checks.
# It never authorizes repo -> live config merge or lists secrets, OAuth credentials, or routing.
schema_version: 1
global_workflow:
  scope: hermes-codex-github-user-overlay
  source_of_truth: repository
  owned_asset_roots:
    - skills/autonomous-ai-agents/codex
    - skills/github/github-auth
    - skills/github/github-code-review
    - skills/github/github-issues
    - skills/github/github-pr-workflow
    - skills/github/github-repo-management
    - skills/model-switch
    - skills/software-development/agent-workflow-fortress
    - skills/software-development/project-data-boundary
    - skills/software-development/python-testing
    - skills/software-development/requesting-code-review
    - skills/software-development/sleep-mode
    - skills/software-development/windows-development-environment
  owned_binary_paths:
    - bin/codex
    - bin/codex.cmd
    - bin/hermes-npx
    - bin/hermes-npx.cmd
    - bin/hermes-project-data.py
    - bin/hermes-project-terminal-guard.py
  owned_file_mappings:
    - source: config/SOUL.md
      target: SOUL.md
  deployment: repo-to-live
managed:
  display.busy_input_mode: replace
  display.language: replace
  sessions.auto_prune: replace
  memory.memory_enabled: replace
  memory.user_profile_enabled: replace
  memory.memory_char_limit: replace
  memory.user_char_limit: replace
  platform_toolsets.cli: replace
  mcp_servers:
    # Isolated baseline construction only; never a live Home deployment instruction.
    strategy: merge_owned
    owned_names: [context7]
  hooks.pre_tool_call:
    # Isolated baseline construction only; never a live Home deployment instruction.
    strategy: replace_owned_matcher
    owned_matcher: terminal
  plugins.enabled:
    # Isolated baseline construction only; never a live Home deployment instruction.
    strategy: merge_additive
preserved:
  - model.provider
  - model.default
  - model.base_url
  - model.api_key
  - model.other
  - credentials
  - auth.json
  - mcp_servers.user_defined
  - quick_commands.user_defined
  - model_picker.user_defined
  - plugins.user_enabled
  - sessions
  - memories
forbidden:
  - model routes
  - model picker lanes
  - model-switching quick commands
  - .env
  - OAuth tokens
  - refresh tokens
  - browser cookies
  - credential stores
