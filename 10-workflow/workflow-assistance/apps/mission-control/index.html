<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORK-LAB Mission Control</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 16px; color: var(--accent); }
  .status-bar { display: flex; gap: 16px; margin-bottom: 24px; font-size: 13px; }
  .status-item { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; }
  .status-item .label { color: #8b949e; }
  .status-item .value { font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card h3 { font-size: 14px; margin-bottom: 8px; }
  .card .meta { font-size: 12px; color: #8b949e; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge.success { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.failed { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge.pending { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .empty { text-align: center; padding: 48px; color: #8b949e; }
  .refresh { background: var(--accent); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; float: right; }
  #dag-list { list-style: none; }
  #dag-list li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  #dag-list li:last-child { border-bottom: none; }
</style>
</head>
<body>
<h1>🎮 WORK-LAB Mission Control <button class="refresh" onclick="load()">刷新</button></h1>
<div class="status-bar">
  <div class="status-item"><span class="label">Dagu</span> <span class="value" id="dagu-status">检查中...</span></div>
  <div class="status-item"><span class="label">DAGs</span> <span class="value" id="dag-count">-</span></div>
  <div class="status-item"><span class="label">最近执行</span> <span class="value" id="last-run">-</span></div>
</div>
<div class="card">
  <h3>📋 DAG 列表</h3>
  <ul id="dag-list"><li class="empty">加载中...</li></ul>
</div>
<script>
const DAGU = 'http://localhost:8080';
async function load() {
  try {
    const r = await fetch(DAGU + '/api/v1/dags');
    const dags = await r.json();
    document.getElementById('dagu-status').textContent = '✅ 在线';
    document.getElementById('dag-count').textContent = dags.length || 0;
    const list = document.getElementById('dag-list');
    if (!dags.length) { list.innerHTML = '<li class="empty">暂无 DAG</li>'; return; }
    list.innerHTML = dags.map(d => {
      const s = d.status === 'succeeded' ? 'success' : d.status === 'failed' ? 'failed' : 'pending';
      return '<li><span>' + (d.name || d.dagId || 'unnamed') + '</span><span class="badge ' + s + '">' + (d.status || 'pending') + '</span></li>';
    }).join('');
    document.getElementById('last-run').textContent = dags[0] ? (dags[0].startedAt || '-') : '-';
  } catch(e) {
    document.getElementById('dagu-status').textContent = '❌ 离线';
    document.getElementById('dag-list').innerHTML = '<li class="empty">Dagu 未启动 (localhost:8080)</li>';
  }
}
load();
</script>
</body>
</html>
