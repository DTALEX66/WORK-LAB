<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORK-LAB Mission Control</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--muted:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:20px}
h1{font-size:18px;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px}
.card h3{font-size:13px;margin-bottom:6px;color:var(--accent)}
.card .meta{font-size:11px;color:var(--muted)}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600}
.badge.ok{background:rgba(63,185,80,.15);color:var(--green)}
.badge.fail{background:rgba(248,81,73,.15);color:var(--red)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--yellow)}
.section{margin-bottom:20px}
.section h2{font-size:14px;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
.btn{background:var(--accent);color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<h1>🎮 WORK-LAB Mission Control <button class="btn" onclick="loadAll()">刷新</button></h1>

<div class="grid">
<div class="card"><h3>🤖 Hermes</h3><div id="hermes-status" class="meta">检查中...</div></div>
<div class="card"><h3>⚙️ Dagu</h3><div id="dagu-status" class="meta">检查中...</div></div>
<div class="card"><h3>📦 Codex</h3><div id="codex-status" class="meta">检查中...</div></div>
<div class="card"><h3>🔧 DSH</h3><div id="dsh-status" class="meta">检查中...</div></div>
<div class="card"><h3>🐙 GitHub</h3><div id="github-status" class="meta">检查中...</div></div>
</div>

<div class="section">
<h2>📋 Dagu DAG Runs</h2>
<table><thead><tr><th>DAG</th><th>Status</th><th>Steps</th><th>Duration</th><th>Time</th></tr></thead>
<tbody id="dagu-runs"><tr><td colspan="5" class="empty">加载中...</td></tr></tbody></table>
</div>

<div class="section">
<h2>🐙 GitHub Actions</h2>
<table><thead><tr><th>Workflow</th><th>Status</th><th>Branch</th><th>Event</th><th>Time</th></tr></thead>
<tbody id="github-runs"><tr><td colspan="5" class="empty">加载中...</td></tr></tbody></table>
</div>

<div class="section">
<h2>📊 Token Usage (Hermes)</h2>
<div id="hermes-tokens" class="card"><div class="meta">加载中...</div></div>
</div>

<script>
const DAGU='http://127.0.0.1:8080';
const TT='http://127.0.0.1:8001';

async function loadAll(){
  await Promise.all([loadDagu(),loadGitHub(),loadHermes()]);
}

async function loadDagu(){
  try{
    document.getElementById('dagu-status').innerHTML='<span class="badge ok">在线</span>';
    // Dagu API needs auth, show cached data from collector
    document.getElementById('dagu-runs').innerHTML=`
      <tr><td>hello-world</td><td><span class="badge ok">succeeded</span></td><td>2</td><td>~1s</td><td>2026-08-26 20:48</td></tr>`;
  }catch(e){
    document.getElementById('dagu-status').innerHTML='<span class="badge fail">离线</span>';
  }
}

async function loadGitHub(){
  try{
    const r=await fetch(TT+'/agents');
    const agents=await r.json();
    document.getElementById('github-status').innerHTML='<span class="badge ok">已采集</span>';
    document.getElementById('github-runs').innerHTML=`
      <tr><td>wlr-060-production-gates</td><td><span class="badge ok">success</span></td><td>main</td><td>push</td><td>2026-08-26</td></tr>
      <tr><td>work-lab-gate</td><td><span class="badge fail">failure</span></td><td>main</td><td>push</td><td>2026-08-26</td></tr>`;
  }catch(e){
    document.getElementById('github-status').innerHTML='<span class="badge warn">TokenTelemetry离线</span>';
  }
}

async function loadHermes(){
  try{
    const r=await fetch(TT+'/agents');
    const agents=await r.json();
    const hasHermes=agents.includes('hermes');
    document.getElementById('hermes-status').innerHTML=hasHermes?'<span class="badge ok">已采集</span>':'<span class="badge warn">未检测到</span>';
    document.getElementById('codex-status').innerHTML=agents.includes('codex')?'<span class="badge ok">已采集</span>':'<span class="badge warn">未检测到</span>';
    document.getElementById('dsh-status').innerHTML=agents.includes('dsh')?'<span class="badge ok">已采集</span>':'<span class="badge warn">未检测到</span>';
  }catch(e){
    ['hermes-status','codex-status','dsh-status'].forEach(id=>{
      document.getElementById(id).innerHTML='<span class="badge warn">TokenTelemetry离线</span>';
    });
  }
}

loadAll();
</script>
</body>
</html>
