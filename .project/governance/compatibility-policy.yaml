schemaVersion: work-lab-compatibility-policy/v1
strategy: capability-first
permanentExactVersionLock: false
perRunRuntimeSnapshotRequired: true
unknownVersionPolicy: run-conformance-then-unverified
silentFallback: false
dependencyLockfiles:
  purpose: reproducible-snapshot
  updateable: true
clients:
  initial: [hermes, codex, cc-switch, github]
  plannedByCapability: [cursor, workbuddy, claude-code, other-agent-software]
rootResolution:
  - explicit-argument
  - manifest-relative-path
  - environment-variable
  - current-git-root
forbidden:
  - hard-coded-user-install-path
  - permanent-client-binding
  - silent-degraded-mode
  - guessed-token-usage
