schemaVersion: work-lab-asset-routing/v1
principles:
  - preserve-before-classify
  - never-delete-for-size-alone
  - separate-runtime-eligibility-from-research-retention
routes:
  source-code: git
  large-binary: lfs-or-approved-release-artifact
  research-material: provenance-inventory-and-external-artifact-record
  credentials: forbidden
  generated-evidence: ignored-.project-local-artifacts
# 80-evidence/ is a pre-2026-09 legacy alias; since the directory
# convergence it lands in .project-local/artifacts (canonicalEvidenceRoot).
provenance: required-for-imported-assets
