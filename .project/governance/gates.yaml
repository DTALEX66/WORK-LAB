    - run_quality_gate
    - unittest_discover
    - verify_contract_catalog
    - verify_module_dependencies
    - verify_project_data_boundary
    - verify_supply_chain
    - verify_source_health
    - verify_source_ledger
    - verify_cross_module_source_index
    - verify_source_governance
    - verify_skill_mcp_consistency
  app:
    - observer_frontend_build
    - observer_frontend_test
    - token_monitor_build
  golden_path:
