name: Verify Open Design Assistance V2.1
on:
  push:
    paths:
      - 'opendesign-assistance/**'
      - '.github/workflows/verify-open-design-assistance-v21.yml'
  pull_request:
    paths:
      - 'opendesign-assistance/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python opendesign-assistance/scripts/verify_visual_quality_v21.py
