# Declarative ownership contract for repo -> live Hermes config merge.
# Never list secrets, OAuth credentials, or active provider routing as managed data.
schema_version: 1
global_workflow:
  scope: hermes-cc-switch-codex-github
  source_of_truth: repository
  owned_asset_roots:
    - skills/autonomous-ai-agents/codex
    - skills/github
    - skills/model-switch
    - skills/software-development
  deployment: repo-to-live
managed:
  display.busy_input_mode: replace
  display.streaming: replace
  agent.reasoning_effort: replace
  model.max_tokens: replace
  model_picker.custom_lanes: replace
  quick_commands:
    strategy: replace_owned
    owned_prefix: 切换
  mcp_servers:
    strategy: merge_owned
    owned_names: [context7]
  hooks.pre_tool_call:
    strategy: replace_owned_matcher
    owned_matcher: terminal
  plugins.enabled:
    strategy: merge_additive
preserved:
  - model.provider
  - model.default
  - model.base_url
  - model.api_key
  - credentials
  - auth.json
  - mcp_servers.user_defined
  - quick_commands.user_defined
  - plugins.user_enabled
forbidden:
  - .env
  - OAuth tokens
  - refresh tokens
  - browser cookies
  - credential stores
