name: work-lab-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    name: gate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      required_gates: ${{ steps.plan.outputs.required_gates }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      run_workflow: ${{ steps.plan.outputs.run_workflow }}

      run_observer: ${{ steps.plan.outputs.run_observer }}
      run_integration: ${{ steps.plan.outputs.run_integration }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gate-plan dependencies
        run: python -m pip install --disable-pip-version-check --no-input "PyYAML>=6,<7" "jsonschema>=4,<5"
      - name: Discover changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p .hermes/task-runtime/ci
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$PR_BASE_SHA" "$HEAD_SHA" > .hermes/task-runtime/ci/changed-paths.txt
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > .hermes/task-runtime/ci/changed-paths.txt
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > .hermes/task-runtime/ci/changed-paths.txt
          fi
      - name: Compute canonical gate plan
        id: plan
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/ci/emit_gate_plan.py \
            --root . \
            --profile 00-governance/work-lab.project-profile.yaml \
            --repository "${{ github.repository }}" \
            --commit "$HEAD_SHA" \
            --changed-path-file .hermes/task-runtime/ci/changed-paths.txt \
            --github-output "$GITHUB_OUTPUT"

  workflow:
    name: workflow-assistance
    needs: plan
    if: needs.plan.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install workflow validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input "PyYAML>=6,<7" "jsonschema>=4,<5"
      - name: Run workflow structural and contract gates
        run: |
          # portable-install-runtime requires an explicitly provisioned Hermes binary;
          # it remains a separate runtime/readback gate, not a fabricated CI success.
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py governance
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py compile
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py runtime-convergence
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py skill-provenance
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py security
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py context-pack
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py client-neutral-manifest
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py core-schemas
          python 10-workflow/workflow-assistance/tests/test_platform_identity.py
          python 10-workflow/workflow-assistance/tests/test_instance_reconciler.py
          python 10-workflow/workflow-assistance/tests/test_config_ownership.py
          python 10-workflow/workflow-assistance/tests/test_telemetry_ledger.py
          python 10-workflow/workflow-assistance/tests/test_sidecar.py
          python 10-workflow/workflow-assistance/tests/test_config_coordinator.py
          python 10-workflow/workflow-assistance/tests/test_sidecar_lock.py
          python 10-workflow/workflow-assistance/tests/test_project_profile.py
          python 10-workflow/workflow-assistance/tests/test_observer_projection_adapter.py
          python scripts/ci/generate_current_state.py --check-current
          python tests/ci/test_stage3_baseline.py
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py adapter-registry
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py adapter-conformance
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py acp-conformance
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py otel-mapping
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py usage-ingestion
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py memory-contamination
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py task-ledger-replay
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py portable-install
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py provider-inventory
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py mcp-audit
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py shell
          python 10-workflow/workflow-assistance/scripts/workflow/run_quality_gate.py powershell


  observer:
    name: observer
    needs: plan
    if: needs.plan.outputs.run_observer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 30-observer/work-lab-observer
        env:
          PYTHONPATH: src:scripts:../../10-workflow/workflow-assistance/scripts/workflow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Observer read-only skeleton
        run: |
          python scripts/verify_observer_skeleton.py
          python tests/test_observer_skeleton.py
          python tests/test_observer_runtime.py
          python tests/test_observer_evidence.py
          python tests/test_observer_store.py
          python tests/test_observer_dashboard.py
          python scripts/verify_usage_rollup.py
          python tests/test_usage_rollup.py
          python tests/test_observer_canonical.py
          python tests/test_observer_events_migration.py
      - name: Verify Observer Web and desktop contracts
        run: |
          node tests/run_all_tests.js
          for file in web/scripts/*.js; do node --check "$file"; done

  integration:
    name: integration
    needs: plan
    if: needs.plan.outputs.run_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run root governance tests
        run: python tests/ci/test_governance_gate.py
      - name: Verify contract catalog references
        run: python scripts/ci/verify_contract_catalog.py
      - name: Verify typed module dependencies
        run: python scripts/ci/verify_module_dependencies.py
      - name: Verify project data boundary
        run: python scripts/ci/verify_project_data_boundary.py
      - name: Verify supply-chain pins
        run: python scripts/ci/verify_supply_chain.py
      - name: Verify offline source health (NX-600)
        run: python scripts/ci/verify_source_health.py
      - name: Run offline source health tests (NX-600)
        run: python tests/ci/test_source_health.py
      - name: Verify size/performance/boundary regression (NX-710)
        run: python scripts/ci/verify_regression_report.py
      - name: Run size/performance/boundary regression tests (NX-710)
        run: python tests/ci/test_regression_report.py
      - name: Verify sanitized error ledger
        run: python scripts/ci/verify_error_ledger.py
      - name: Verify source ledger readback
        run: python scripts/ci/verify_source_ledger.py --root .
      - name: Run source ledger tests
        run: python tests/ci/test_source_ledger.py
      - name: Verify cross-module source index (NX-100)
        run: python scripts/ci/verify_cross_module_source_index.py
      - name: Run cross-module source index tests (NX-100)
        run: python tests/ci/test_cross_module_source_index.py
      - name: Verify source governance (NX-110)
        run: python scripts/ci/verify_source_governance.py
      - name: Run source governance tests (NX-110)
        run: python tests/ci/test_source_governance.py
      - name: Verify skill + MCP consistency (NX-210)
        run: python scripts/ci/verify_skill_mcp_consistency.py
      - name: Run skill + MCP consistency tests (NX-210)
        run: python tests/ci/test_skill_mcp_consistency.py
      - name: Verify WL inheritance matrix
        run: python scripts/ci/verify_wl_inheritance_matrix.py
      - name: Run current state tests
        run: |
          python tests/ci/test_current_state.py
          python scripts/ci/generate_current_state.py --check-current
      - name: Run Stage 3 frozen baseline tests
        run: python tests/ci/test_stage3_baseline.py
      - name: Run root governance contract tests
        run: python tests/ci/test_root_governance_contracts.py

  aggregate:
    name: aggregate
    if: always()
    needs:
      - plan
      - workflow
      - observer
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Aggregate actual job results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          EXPECTED_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          WORKFLOW_RESULT: ${{ needs.workflow.result }}

          OBSERVER_RESULT: ${{ needs.observer.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$PLAN_RESULT" = success
          python -c 'import json, os, subprocess, sys; payload=json.dumps({"gate_plan": json.loads(os.environ["GATE_PLAN_JSON"]), "expected_plan_digest": os.environ["EXPECTED_PLAN_DIGEST"], "expected_head_sha": os.environ["EXPECTED_HEAD_SHA"], "jobs": {"workflow": os.environ["WORKFLOW_RESULT"], "observer": os.environ["OBSERVER_RESULT"], "integration": os.environ["INTEGRATION_RESULT"]}}); result=subprocess.run([sys.executable, "scripts/ci/aggregate_gate.py"], input=payload, text=True); raise SystemExit(result.returncode)'
